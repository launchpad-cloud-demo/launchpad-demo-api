name: CI
on:
  push:
    branches: ['main', 'scenario/**', 'launchcare/**']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r requirements.txt
      - name: Typecheck
        run: mypy app
      - name: Test
        run: pytest
